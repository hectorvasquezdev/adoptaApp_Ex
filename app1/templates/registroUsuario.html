<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptaApp - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
        }
        .left-panel {
            width: 55%;
            background: linear-gradient(135deg, #1a3a1a 0%, #1a6e3a 50%, #2d9e5f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        .left-panel::before {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            top: -100px; left: -100px;
        }
        .left-panel::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -80px; right: -80px;
        }
        .brand-title { color: #fff; font-size: 2.8rem; font-weight: 800; z-index: 1; }
        .brand-title span { color: #86efac; }
        .brand-sub { color: rgba(255,255,255,0.7); font-size: 1rem; margin-top: 0.4rem; z-index: 1; }
        .illustration { width: 300px; margin: 2.5rem 0; z-index: 1; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
        .pills { display: flex; gap: 0.75rem; z-index: 1; flex-wrap: wrap; justify-content: center; }
        .pill {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 50px;
            padding: 0.35rem 1rem; font-size: 0.82rem;
            backdrop-filter: blur(6px);
        }
        .right-panel {
            width: 45%;
            display: flex; align-items: center; justify-content: center;
            padding: 2.5rem; background: #f0f4ff;
        }
        .register-box { width: 100%; max-width: 400px; }
        .register-box h2 { font-size: 1.9rem; font-weight: 700; color: #1a3a1a; }
        .register-box p.sub { color: #6b7280; margin-bottom: 2rem; font-size: 0.95rem; }
        .form-label { font-weight: 600; color: #374151; font-size: 0.88rem; }
        .input-group-text { background: #e8fff0; border: 1.5px solid #a7f3d0; color: #1a6e3a; }
        .form-control { border: 1.5px solid #a7f3d0; border-left: none; padding: 0.65rem 1rem; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-control:focus { border-color: #1a6e3a; box-shadow: 0 0 0 3px rgba(26,110,58,0.12); outline: none; }
        .btn-register {
            background: linear-gradient(135deg, #1a3a1a, #1a6e3a);
            border: none; color: #fff; font-weight: 600;
            font-size: 1rem; padding: 0.75rem;
            border-radius: 10px; transition: opacity 0.2s, transform 0.2s;
        }
        .btn-register:hover { opacity: 0.9; transform: translateY(-1px); color: #fff; }
        .divider { display: flex; align-items: center; gap: 0.75rem; color: #9ca3af; font-size: 0.85rem; margin: 1.25rem 0; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:#d1d5db; }
        .login-link { color: #1a6e3a; font-weight: 600; text-decoration: none; }
        .login-link:hover { text-decoration: underline; }
        .alert-danger { border-radius: 10px; font-size: 0.9rem; border: none; background: #fee2e2; color: #b91c1c; }
        @media (max-width: 768px) { .left-panel { display: none; } .right-panel { width: 100%; } }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="brand-title"><i class="fa-solid fa-paw"></i> Adopta<span>App</span></div>
    <div class="brand-sub">Únete y ayuda a encontrar hogares</div>

    <svg class="illustration" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
        <!-- Corazón grande -->
        <path d="M200 260 C200 260 80 190 80 120 C80 80 110 55 145 65 C165 70 185 85 200 100 C215 85 235 70 255 65 C290 55 320 80 320 120 C320 190 200 260 200 260Z" fill="#86efac" opacity="0.3"/>
        <path d="M200 230 C200 230 100 170 100 115 C100 85 122 65 150 72 C168 77 185 92 200 105 C215 92 232 77 250 72 C278 65 300 85 300 115 C300 170 200 230 200 230Z" fill="#4ade80" opacity="0.6"/>
        <!-- Perrito dentro del corazón -->
        <ellipse cx="200" cy="148" rx="42" ry="35" fill="#86efac"/>
        <ellipse cx="183" cy="120" rx="13" ry="16" fill="#86efac"/>
        <ellipse cx="217" cy="120" rx="13" ry="16" fill="#86efac"/>
        <circle cx="193" cy="148" r="4" fill="#1a3a1a"/>
        <circle cx="207" cy="148" r="4" fill="#1a3a1a"/>
        <ellipse cx="200" cy="158" rx="6" ry="4" fill="#f9a8d4"/>
        <path d="M194 163 Q200 167 206 163" stroke="#1a3a1a" stroke-width="1.5" fill="none"/>
        <!-- Patitas -->
        <ellipse cx="175" cy="183" rx="12" ry="8" fill="#4ade80"/>
        <ellipse cx="195" cy="188" rx="10" ry="7" fill="#4ade80"/>
        <ellipse cx="205" cy="188" rx="10" ry="7" fill="#4ade80"/>
        <ellipse cx="225" cy="183" rx="12" ry="8" fill="#4ade80"/>
        <!-- Estrellas -->
        <text x="100" y="80" font-size="20" fill="#fbbf24" opacity="0.7">✦</text>
        <text x="290" y="90" font-size="14" fill="#86efac" opacity="0.6">✦</text>
        <text x="150" y="270" font-size="10" fill="#f9a8d4" opacity="0.5">✦</text>
    </svg>

    <div class="pills">
        <span class="pill"><i class="fa-solid fa-user-plus me-1"></i> Crear cuenta</span>
        <span class="pill"><i class="fa-solid fa-heart me-1"></i> Gratis</span>
    </div>
</div>

<div class="right-panel">
    <div class="register-box">
        <h2>Crea tu cuenta 🐾</h2>
        <p class="sub">Regístrate para gestionar adopciones</p>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger mb-3">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>{{ msg }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'app1:registro' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" placeholder="Elige un usuario" name="username" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com" name="email">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Crea una contraseña" name="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-register w-100">
                <i class="fa-solid fa-circle-check me-2"></i>Crear cuenta
            </button>
        </form>

        <div class="divider">o</div>

        <p class="text-center text-muted" style="font-size:0.92rem;">
            ¿Ya tienes cuenta?
            <a href="{% url 'app1:ingreso' %}" class="login-link">Inicia sesión</a>
        </p>
        <p class="text-center mt-4" style="font-size:0.78rem; color:#9ca3af;">
            <i class="fa-solid fa-paw me-1"></i> AdoptaApp — Dale un hogar a quien lo necesita
        </p>
    </div>
</div>

</body>
</html>
