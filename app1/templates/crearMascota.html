{% extends "layout.html" %}

{% block content %}

<div class="page-header">
  <h1><i class="fa-solid fa-plus-circle me-2"></i>Nueva Mascota</h1>
  <p>Completa los datos para registrar una mascota en adopción</p>
</div>

<div style="max-width:620px;">
  <div class="card">
    <div class="card-header-custom">
      <i class="fa-solid fa-paw me-2"></i>Datos de la mascota
    </div>
    <div style="padding:1.75rem;">
      <form method="POST" enctype="multipart/form-data" action="{% url 'app1:crearMascota' %}">
        {% csrf_token %}

        <div class="row g-3 mb-3">
          <div class="col-sm-8">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" placeholder="Ej: Firulais" required>
          </div>
          <div class="col-sm-4">
            <label class="form-label">Edad (años)</label>
            <input type="number" class="form-control" name="edad" placeholder="Ej: 3" min="0" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Tipo de Mascota</label>
          <select class="form-select" name="tipo" required>
            <option value="">— Selecciona un tipo —</option>
            {% for tipo in tipos %}
              <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" name="descripcion" rows="3"
                    placeholder="Describe la personalidad y características de la mascota..." required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">Foto</label>
          <input type="file" class="form-control" name="foto" accept="image/*" required>
          <div style="font-size:0.8rem; color:#9ca3af; margin-top:0.3rem;">
            <i class="fa-solid fa-image me-1"></i>Formatos: JPG, PNG, WEBP
          </div>
        </div>

        <div style="display:flex; gap:0.75rem;">
          <button type="submit" class="btn btn-primary-custom">
            <i class="fa-solid fa-check me-1"></i>Guardar mascota
          </button>
          <a href="{% url 'app1:home' %}" class="btn btn-secondary-custom" style="text-decoration:none;">
            <i class="fa-solid fa-arrow-left me-1"></i>Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
